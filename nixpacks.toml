# Nixpacks / Railway build for pnpm monorepo
# Set JJOIN_SERVICE_ROLE=landing on the landing Railway service only.
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
cmds = [
  "sh -c 'if [ \"$JJOIN_SERVICE_ROLE\" = \"landing\" ]; then pnpm --filter @jjoin/landing build; else pnpm --filter @jjoin/types build && pnpm --filter @jjoin/domain build && pnpm --filter @jjoin/validation build && pnpm exec prisma generate --schema=prisma/schema.prisma && pnpm --filter @jjoin/api build; fi'"
]

[start]
cmd = "sh -c 'if [ \"$JJOIN_SERVICE_ROLE\" = \"landing\" ]; then pnpm --filter @jjoin/landing start; else node apps/api/dist/main.js; fi'"
