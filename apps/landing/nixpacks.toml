# Landing nixpacks — loaded via NIXPACKS_CONFIG_FILE from repo root
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
cmds = ["pnpm --filter @jjoin/landing build"]

[start]
cmd = "pnpm --filter @jjoin/landing start"
